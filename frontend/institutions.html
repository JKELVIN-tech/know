<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.onrender.com https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KNOW — Institutions</title>
    <meta name="description" content="Onboard institutions (schools, shops, supermarkets, and more) and manage portal icons." />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body data-page="institutions">
    <div class="app-shell" id="appShell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-logo" id="sidebarLogo" src="./assets/logo.svg" alt="KNOW logo" />
          <div class="brand-text">
            <strong id="sidebarSchool">KNOW</strong>
            <span>Super admin</span>
          </div>
        </div>
        <nav class="side-nav" aria-label="Main"></nav>
        <div class="side-foot">
          <p class="principle">&ldquo;Institutions, accounts and content review, each in their own place.&rdquo;</p>
        </div>
      </aside>

      <main class="main" id="main">
        <header class="topbar">
          <div class="topbar-id">
            <img class="topbar-logo" id="topLogo" src="./assets/logo.svg" alt="KNOW logo" />
            <div class="topbar-copy">
              <p class="greeting" id="greeting">Good morning</p>
              <p class="subtle" id="schoolLine">Super admin console</p>
            </div>
          </div>
          <div class="topbar-actions">
            <button class="icon-btn" id="modeToggle" aria-label="Toggle light or dark mode" title="Light / dark mode">
              <span class="ico" data-ico="mode"></span>
            </button>
          </div>
        </header>

        <section class="page is-active" data-page="institutions">
          <div class="card">
            <div class="card-head">
              <h2>Institutions</h2>
              <button class="primary-btn" id="newSchoolBtn">+ Add institution</button>
            </div>
            <div class="toolbar">
              <div class="search"><input type="search" id="instSearch" placeholder="Search by name, type or county" aria-label="Search institutions" /></div>
              <select id="instSort" aria-label="Sort institutions">
                <option value="name">Name A to Z</option>
                <option value="newest">Newest first</option>
                <option value="active">Most active</option>
                <option value="quiet">Quiet first</option>
              </select>
              <span class="count" id="instCount"></span>
            </div>
            <div class="table-scroll">
            <table class="data-table">
              <thead><tr><th>Institution</th><th>Region</th><th class="num">Staff</th><th class="num">Admins</th><th class="num">Entries (30d)</th><th>Last activity</th><th></th></tr></thead>
              <tbody id="schoolsBody"><tr class="empty-row"><td colspan="7">Loading…</td></tr></tbody>
            </table>
            </div>
          </div>
        </section>
      </main>

      <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    </div>

    <div class="sheet-backdrop" id="sheetBackdrop" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-head">
          <h2 id="sheetTitle">Add institution</h2>
          <button class="icon-btn" id="sheetClose" aria-label="Close">&#10005;</button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="config.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/institutions.js"></script>
  </body>
</html>
