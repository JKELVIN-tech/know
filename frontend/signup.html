<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.onrender.com https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KNOW — Create account</title>
    <meta name="description" content="KNOW is a financial tracking, inventory and accountability portal for institutions: record transactions, manage stock, submit audits, and post news." />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
    <body data-page="signup">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-brand">
          <img src="./assets/logo.svg" alt="KNOW logo" />
          <div><strong>KNOW</strong><span>Institution financial audit &amp; records portal</span></div>
        </div>
        <h2>Create your account</h2>
        <p class="hint">This is your own private account. It is not linked to any owner or institution.</p>
        <p class="form-error" id="authError"></p>
        <form id="signupForm">
          <label class="field"><span>Account type</span>
            <select id="signupType" required>
              <option value="personal">Personal (finance entries only)</option>
              <option value="staff">Staff (sales and stock)</option>
            </select>
          </label>
          <label class="field"><span>Full name</span><input type="text" id="signupName" autocomplete="name" required autofocus /></label>
          <label class="field"><span>Username</span><input type="text" id="signupUsername" autocomplete="username" required /></label>
          <label class="field"><span>Email (optional, for password reset)</span><input type="email" id="signupEmail" autocomplete="email" /></label>
          <label class="field"><span>Partner code (optional)</span><input type="text" id="signupPartner" autocomplete="off" autocapitalize="characters" /></label>
          <label class="field"><span>Password</span><input type="password" id="signupPassword" autocomplete="new-password" required /></label>
          <button class="primary-btn auth-submit" type="submit" id="signupSubmit">Create account</button>
        </form>
        <p class="hint"><a href="login.html">Back to log in</a></p>
      </div>
    </div>
    <script src="config.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/signup.js"></script>
  </body>
</html>
