<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.onrender.com https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KNOW — Log in</title>
    <meta name="description" content="KNOW is a financial tracking, inventory and accountability portal for institutions: record transactions, manage stock, submit audits, and post news." />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body data-page="login">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-brand">
          <img src="./assets/logo.svg" alt="KNOW logo" />
          <div>
            <strong>KNOW</strong>
            <span>Institution financial audit &amp; records portal</span>
          </div>
        </div>

        <p class="form-error" id="authError"></p>

        <form id="loginForm">
          <label class="field"><span>Username</span><input type="text" id="loginUsername" autocomplete="username" required autofocus /></label>
          <label class="field"><span>Password</span><input type="password" id="loginPassword" autocomplete="current-password" required /></label>
          <button class="primary-btn auth-submit" type="submit" id="loginSubmit">Log in</button>
        </form>

        <p class="hint"><a href="forgot-password.html">Forgot your password?</a></p>
        <p class="hint">Accounts are issued by your institution's super admin. Contact them if you need access.</p>
        <p class="hint">Super admin? <a href="admin-login.html">Sign in here</a>.</p>

        <a class="ghost-btn" href="https://github.com/bashevent01-commits/teach-app/releases/download/android-latest/app-debug.apk" download style="margin-top: 14px; text-decoration: none;">
          <span class="ico" data-ico="download"></span> Download Android app (preview build)
        </a>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/login-staff.js"></script>
  </body>
</html>
