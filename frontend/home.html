<!doctype html>
<html lang="en" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KNOW — Home</title>
    <meta name="description" content="Financial overview for your institution." />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body data-page="home">
    <div class="app-shell" id="appShell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-logo" id="sidebarLogo" src="./assets/logo.svg" alt="Institution logo" />
          <div class="brand-text">
            <strong id="sidebarSchool">KNOW</strong>
            <span>Accountability</span>
          </div>
        </div>
        <nav class="side-nav" aria-label="Main"></nav>
        <div class="side-foot">
          <p class="principle">&ldquo;Record money once, then let KNOW organize it everywhere else.&rdquo;</p>
        </div>
      </aside>

      <main class="main" id="main">
        <header class="topbar">
          <div class="topbar-id">
            <img class="topbar-logo" id="topLogo" src="./assets/logo.svg" alt="Institution logo" />
            <div class="topbar-copy">
              <p class="greeting" id="greeting">Good morning</p>
              <p class="subtle" id="schoolLine">KNOW</p>
            </div>
          </div>
          <div class="topbar-actions">
            <button class="icon-btn" id="modeToggle" aria-label="Toggle light or dark mode" title="Light / dark mode">
              <span class="ico" data-ico="mode"></span>
            </button>
          </div>
        </header>

        <section class="page is-active" data-page="home">
          <div class="card overview">
            <div class="card-head">
              <div>
                <h2>Financial overview</h2>
                <p class="subtle">Calculated from every recorded transaction</p>
              </div>
              <span class="pill" id="totalPill">Net &middot; KES 0.00</span>
            </div>
            <div class="kpi-row" id="overviewKpis">
              <div class="kpi"><strong id="kpiIncome">—</strong><span>Income</span></div>
              <div class="kpi"><strong id="kpiExpense">—</strong><span>Expense</span></div>
              <div class="kpi"><strong id="kpiNet">—</strong><span>Net</span></div>
            </div>
            <div class="money-row" id="moneyRow">
              <div class="kpi"><strong id="moneyCash">—</strong><span>Cash</span></div>
              <div class="kpi"><strong id="moneyMpesa">—</strong><span>M-Pesa</span></div>
              <div class="kpi"><strong id="moneyBank">—</strong><span>Bank</span></div>
            </div>
            <div class="money-hint">
              <span class="subtle" id="moneyNote">What you hold right now</span>
              <button type="button" class="ghost-btn" id="openingBtn">Starting balances</button>
            </div>
          </div>

          <div class="action-grid">
            <button class="action-card receive" data-flow="income">
              <span class="action-ico"><span class="ico" data-ico="in"></span></span>
              <span class="action-copy">
                <strong>Receiving</strong>
                <small>Money coming into the institution</small>
              </span>
            </button>
            <button class="action-card pay" data-flow="expense">
              <span class="action-ico"><span class="ico" data-ico="out"></span></span>
              <span class="action-copy">
                <strong>Paying</strong>
                <small>Money leaving the institution</small>
              </span>
            </button>
          </div>

          <div class="card">
            <div class="card-head">
              <h2>Recent activity</h2>
              <a class="ghost-btn" href="audit.html">Statements</a>
            </div>
            <ul class="txn-list" id="recentList"></ul>
          </div>
        </section>
      </main>

      <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    </div>

    <div class="sheet-backdrop" id="sheetBackdrop" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-head">
          <h2 id="sheetTitle">Receiving</h2>
          <button class="icon-btn" id="sheetClose" aria-label="Close">&#10005;</button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="config.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/offline.js"></script>
    <script src="./js/home.js"></script>
  </body>
</html>
