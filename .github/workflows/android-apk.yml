name: Build Android APK

# Builds the debug APK (signed automatically with AGP's built-in debug
# keystore, so it installs directly — no manual signing needed for this
# preview build) and republishes it under the same release tag each time,
# giving the website a stable download link that always points at the
# latest build from main.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # No gradle-wrapper.jar is committed (this repo's dev environment has
      # no network access to generate it) — setup-gradle installs a real
      # Gradle and we invoke it directly instead of ./gradlew.
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: "8.7"

      - name: Use the private signing key when one is configured
        env:
          KEYSTORE_B64: ${{ secrets.KNOW_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KNOW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KNOW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KNOW_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/know.jks"
            echo "KNOW_KEYSTORE_PATH=$RUNNER_TEMP/know.jks" >> "$GITHUB_ENV"
            echo "KNOW_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KNOW_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KNOW_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the private key"
          else
            echo "No private key configured; using the fallback key"
          fi

      - name: Build release APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon -x lintVitalRelease
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-debug.apk
          echo "$GITHUB_SHA" > app/build/outputs/apk/release/version.txt

      - name: Publish as a rolling release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: android-latest
          name: "K.N.O.W. Android — latest build"
          body: |
            Auto-built release APK from the latest push to `main` (commit ${{ github.sha }}).
            The file keeps its old name so existing installs can update in place.
            Android 8.0 (API 26) or newer. You may need to allow "install from unknown sources".
          artifacts: android/app/build/outputs/apk/release/app-debug.apk,android/app/build/outputs/apk/release/version.txt
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
